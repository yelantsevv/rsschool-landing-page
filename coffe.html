<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coffee House</title>
    <script src="./script.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:ital,wght@1,500;1,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="header-menu">
          <div class="logo">
            <a href="./index.html">
              <img src="./img/logo.svg" class="light" alt="Coffee House Logo" />
              <img
                src="./img/logo-dark.svg"
                class="dark"
                alt="Coffee House Logo"
              />
            </a>
          </div>

          <nav>
            <ul class="nav">
              <li><a class="link" href="#">Favorite coffee</a></li>
              <li><a class="link" href="#about">About</a></li>
              <li><a class="link" href="#mobile">Mobile app</a></li>
              <li><a class="link" href="#contacts">Contact us</a></li>
            </ul>
          </nav>

          <div class="actions">
            <button
              class="theme-switch"
              id="theme-switch"
              aria-label="Toggle theme"
            >
              <img
                src="./img/Theme-switch.svg"
                class="light"
                alt="switch"
                aria-hidden="true"
              />
              <img
                src="./img/dark-border-primary.svg"
                class="dark"
                alt="switch"
                aria-hidden="true"
              />
            </button>
            <a href="./coffe.html" class="coffee-menu">
              <span>Menu</span>
              <img src="./img/coffee-cup.svg" class="light" alt="coffee cup" />
              <img src="./img/coffee-dark.svg" class="dark" alt="coffee cup" />
            </a>
            <div class="burger"></div>
          </div>
        </div>
      </header>

      <main>
        <section >
          
        </section>
      </main>

      <footer class="footer" id="contacts">
        <div class="footer__container">
          <div class="footer__offer">
            <h2 class="footer-title">
              Sip, Savor, Smile. <br />
              <span class="footer-accent">It’s coffee time!</span>
            </h2>

            <div class="footer__socials">
              <a href="https://twitter.com" target="_blank" class="social-link">
                <img src="./img/tw.svg" alt="twitter" />
              </a>
              <a
                href="https://instagram.com"
                target="_blank"
                class="social-link"
              >
                <img src="./img/in.svg" alt="instagram" />
              </a>
              <a
                href="https://facebook.com"
                target="_blank"
                class="social-link"
              >
                <img src="./img/fb.svg" alt="facebook" />
              </a>
            </div>
          </div>

          <div class="footer__contacts">
            <h3 class="footer__subtitle">Contact us</h3>

            <ul class="footer__list">
              <li>
                <a
                  href="https://maps.google.com"
                  target="_blank"
                  class="footer__link"
                >
                  <img src="./img/pin-alt.svg" alt="maps" />
                  <span>8558 Green Rd., LA</span>
                </a>
              </li>
              <li>
                <a href="tel:+16035550123" class="footer__link">
                  <img src="./img/tel.svg" alt="tel" />
                  <span>+1 (603) 555-0123</span>
                </a>
              </li>
              <li>
                <div class="footer__link">
                  <img src="./img/clock.svg" alt="clock" />
                  <span>Mon–Sat: 9:00–23:00</span>
                </div>
              </li>
            </ul>
          </div>
        </div>
      </footer>
    </div>
  </body>
</html>
